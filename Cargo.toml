[workspace]
resolver = "2"
members = [
    "crates/organism-core",
    "crates/serialization",
    "crates/editor",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bevy = "0.20.0"
avian3d = { version = "0.8.0", default-features = false, features = ["3d", "parry-f32", "xpbd_joints", "debug-plugin"] }
organism-core = { path = "crates/organism-core" }
organism-serialization = { path = "crates/serialization" }
